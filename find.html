<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Find the unicorn!</title>
<style>
/* Birthday scan page: Lana gives Sky her first clue: find the Sky's Letters unicorn already on her Home Screen (her names and voices live there). */
:root{color-scheme:light}
html,body{margin:0;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;text-align:center;color:#3a1030;
  font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  background:linear-gradient(135deg,#ffd1e6,#fff3b8,#c9f5dc,#c8e9ff,#e6d4ff);background-size:400% 400%;animation:sky 10s ease infinite}
@keyframes sky{50%{background-position:100% 100%}}
h1{margin:0;font-size:min(10vw,8vh);line-height:1.1}
h1 span{display:inline-block;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px)}}
.find{font-size:min(6vw,5vh);margin:0}
.icon{border:0;padding:0;background:none;cursor:pointer;width:min(46vw,36vh);height:min(46vw,36vh);border-radius:22%;animation:wiggle 2.4s ease-in-out infinite}
.icon img{width:100%;height:100%;border-radius:22%;display:block;animation:glow 1.2s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-9deg) scale(.92)}50%{transform:rotate(9deg) scale(1.12)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 8px #fff,0 0 22px 10px #ffe680}50%{box-shadow:0 0 0 8px #fff,0 0 60px 30px #ff7eb6}}
.icon:focus-visible{outline:4px solid #3a1030;outline-offset:10px}
.hear{font-size:min(4.5vw,3.4vh);margin:0;opacity:.85}
.sp{position:fixed;pointer-events:none;animation:tw 2s ease-in-out infinite}
@keyframes tw{50%{opacity:.2;transform:scale(.6)}}
small{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:16px;right:16px;font-size:15px;opacity:.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body>
<h1 id="hb"></h1>
<p class="find">Go to your Home Screen<br>and find me! 🦄</p>
<button class="icon" id="me" type="button" aria-label="Hear Lana say your clue"><img src="icon-512.png" alt=""></button>
<p class="hear">Tap me to hear Lana 🔊</p>
<small>Grown-up: swipe up from the bottom to go to the Home Screen, then help Sky find the Sky's Letters unicorn.</small>
<script>
document.getElementById('hb').innerHTML=[...'Your first clue, Sky! 🎉'].map((c,i)=>`<span style="animation-delay:${i*.06}s;color:${['#ff5fa8','#f2a100','#2fb87f','#3a9bff','#9b6bff'][i%5]}">${c===' '?'&nbsp;':c}</span>`).join('');
for(let i=0;i<24;i++){const s=document.createElement('div');s.className='sp';s.textContent=['✨','⭐','🌈','💖'][i%4];
  s.style.cssText=`left:${Math.random()*96}%;top:${Math.random()*92}%;font-size:${14+Math.random()*30}px;animation-delay:${Math.random()*2}s`;document.body.append(s)}
const clue=new Audio('clue.mp3');   // Lana (Ava voice) says the clue. iPad needs a tap first, so tapping the unicorn plays it.
const play=()=>{clue.currentTime=0;clue.play().catch(()=>{})};
document.getElementById('me').onclick=play;
play();   // works on the iMac; on the iPad it waits for the tap
</script>
</body></html>
