<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sky's Letters">
<title>Sky's Letters</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<meta name="theme-color" content="#bfe9ff">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--pink:#ff6fb5;--purple:#9b6bff;--sun:#ffd447;--mint:#4fd3a8;--blue:#58b7ff;--ink:#4a3a78;--line:#e3d4f7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{font-family:ui-rounded,"Arial Rounded MT Bold","Avenir Next Rounded",SkyThai,"Trebuchet MS",system-ui,sans-serif;font-weight:700;color:var(--ink);
 background:linear-gradient(160deg,#bfe9ff 0%,#ffe3f4 55%,#fff6c9 100%)}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.scr{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;align-items:center;padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom))}
.scr.on{display:flex}
.th{font-family:SkyThai,"Thonburi",sans-serif}
.round{border-radius:999px}
.btn{background:var(--sun);box-shadow:0 6px 0 #d9a800;border-radius:26px;font-size:34px;min-width:84px;height:76px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d9a800}
.btn.pink{background:var(--pink);box-shadow:0 6px 0 #d54a90;color:#fff}
.btn.small{font-size:24px;height:56px;min-width:56px;border-radius:18px}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes bob{50%{transform:translateY(-6%)}}
@keyframes jump{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-22%) rotate(-8deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-14%) rotate(8deg)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}
@keyframes rise{to{transform:translateY(-130vh)}}
@keyframes twinkle{50%{opacity:.25;transform:scale(.7)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes wobble{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.06)}}
@keyframes ring{0%{transform:translate(-50%,-50%) scale(.6);opacity:.9}100%{transform:translate(-50%,-50%) scale(2.2);opacity:0}}
/* Mali the unicorn */
.mali{display:block;height:100%;width:auto;animation:bob 2.4s ease-in-out infinite;overflow:visible}
.mali .eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.mali .m-open{display:none}
.mali.cheer{animation:jump .9s ease-in-out 2}
.mali.cheer .m-open{display:block}.mali.cheer .m-smile{display:none}
/* welcome */
#welcome{padding:0;justify-content:flex-end;background:linear-gradient(#8fd0ff,#d9f1ff 55%,#fff3d1)}
#welcome .art{position:absolute;inset:0;width:100%;height:100%}
#welcome .card{position:relative;margin-bottom:max(3vh,env(safe-area-inset-bottom));text-align:center;display:flex;flex-direction:column;align-items:center;gap:1.2vh}
.title{font-size:min(11vw,13vh,96px);line-height:1;letter-spacing:1px;text-shadow:0 4px 0 #fff,0 8px 0 rgba(155,107,255,.35)}
.title span{display:inline-block}
.from{font-size:min(5vw,5.5vh,40px);background:#fff;color:var(--pink);padding:.35em 1em;border-radius:999px;box-shadow:0 5px 0 #ffc2dd}
/* birthday */
#bday{background:radial-gradient(circle at 50% 30%,#6a4bd6,#2a1a6b 70%);color:#fff;justify-content:center;overflow:hidden}
#bday .star{position:absolute;color:#ffe89a;animation:twinkle 2s infinite}
#bday .num{position:absolute;font-weight:900;opacity:0;animation:popnum 2.4s ease-in-out infinite;text-shadow:0 4px 0 rgba(0,0,0,.2);pointer-events:none}
@keyframes popnum{0%{opacity:0;transform:scale(0) rotate(-20deg)}20%{opacity:.9;transform:scale(1.15) rotate(8deg)}35%{transform:scale(1) rotate(0)}75%{opacity:.9}100%{opacity:0;transform:scale(.3)}}
#bday .rbow{position:absolute;left:50%;top:4vh;width:150vmin;height:150vmin;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,transparent 52%,#ff6b6b 52% 55%,#ffa94d 55% 58%,#ffe066 58% 61%,#69db7c 61% 64%,#4dabf7 64% 67%,#9775fa 67% 70%,transparent 70%);opacity:.6;pointer-events:none}
#gift{z-index:2;font-size:min(44vw,44vh);animation:wobble 1s ease-in-out infinite;background:none;line-height:1}
#bparty{display:none;flex-direction:column;align-items:center;gap:1.5vh;z-index:2}
#bday.open #gift{display:none}#bday.open #bparty{display:flex}
.hb{font-size:min(9vw,9vh,80px);text-align:center;line-height:1.1}
.hb span{display:inline-block;animation:bob 1.2s ease-in-out infinite}
.hb .name{font-size:1.5em;color:#fff3a6;text-shadow:0 4px 0 #ff8fc7,0 8px 0 #8a5cd6}
#cake{height:min(34vh,50vw)}
#cake .flame{cursor:pointer;transform-box:fill-box;transform-origin:50% 100%;animation:wobble .5s infinite}
#brow{display:flex;align-items:flex-end;gap:3vw;height:min(34vh,50vw)}
.balloon{position:absolute;bottom:-20vh;font-size:min(14vw,110px);animation:rise linear forwards}
/* home */
#hometop{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{background:#fff;border-radius:999px;padding:8px 18px;font-size:min(5vw,30px);box-shadow:0 4px 0 var(--line)}
.name{font-size:min(6.2vw,7vh,60px);text-shadow:0 3px 0 #fff;white-space:nowrap}
#homemid{flex:1;width:100%;max-width:1100px;display:flex;align-items:center;gap:2vw;min-height:0}
#homemali{height:min(34vh,30vw);flex:none}
#tracks{flex:1;display:flex;flex-direction:column;gap:1.6vh;min-width:0}
.track{display:flex;gap:2vw;align-items:stretch}
.lv{flex:1;position:relative;border-radius:30px;padding:1.8vh 8px;background:#fff;box-shadow:0 8px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:.4vh;min-width:0;border:5px solid #fff}
.lv:active{transform:translateY(4px)}
.lv .ic{font-size:min(9vh,5.6vw,84px);line-height:1.15;white-space:nowrap}
.lv .nm{font-size:min(3.2vh,4vw,26px)}
.lv .pr{font-size:min(2.8vh,3.4vw,22px);color:#8a7bb5}
.lv.c5{background:#ffeeda}.lv.c6{background:#fff}.lv.c7{background:#e9fbff}.lv.c8{background:#ffe9f6}.lv.c0{background:#ffe6f2}.lv.c1{background:#fff3c4}.lv.c2{background:#dff6ff}.lv.c3{background:#e6ffe9}.lv.c4{background:#efe6ff}
.lv.lock{filter:grayscale(.75);opacity:.6}
.lv.lock::after{content:"🔒";position:absolute;right:8px;top:4px;font-size:min(5vh,40px)}
#hold{position:relative;overflow:hidden;font-size:16px;background:#ffffffaa;border-radius:999px;padding:8px 14px;color:#8a7bb5}
#hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:#c9b6ff88}
@media (orientation:portrait){#homemid{flex-direction:column;justify-content:center;gap:3vh}#homemali{height:24vh}#tracks{flex:none;width:100%;gap:2vh}.lv{padding:2vh 6px}.lv .ic{font-size:min(7vh,6.6vw,72px)}#homemali{height:18vh}}
.secsw{display:flex;gap:12px;justify-content:center}
.secb{flex:1;max-width:320px;font-size:min(4.6vh,5vw,36px);padding:1.2vh 10px;border-radius:999px;background:#ffffff90;color:#8a7bb5;box-shadow:0 5px 0 var(--line)}
.secb.on{background:var(--pink);color:#fff;box-shadow:0 5px 0 #d54a90}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#bg i{position:absolute;font-style:normal;line-height:1;will-change:transform}
@keyframes bgdrift{from{transform:translateX(-25vw)}to{transform:translateX(125vw)}}
@keyframes bgdriftb{from{transform:translateX(125vw) scaleX(-1)}to{transform:translateX(-25vw) scaleX(-1)}}
@keyframes bgrise{from{transform:translateY(20vh)}to{transform:translateY(-130vh)}}
@keyframes bgbob{50%{transform:translateY(-3vh) rotate(4deg)}}
@keyframes bgsway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes bgflit{0%{transform:translate(0,0)}25%{transform:translate(9vw,-7vh)}50%{transform:translate(17vw,2vh)}75%{transform:translate(7vw,8vh)}100%{transform:translate(0,0)}}
body.dark .name,body.dark #lvtitle,body.dark .barT{color:#fff;text-shadow:none}
@media (prefers-reduced-motion:reduce){#bg i{animation:none!important}}
#locked{justify-content:center;gap:2vh;text-align:center;padding:24px}
#locked .mm{height:min(30vh,220px)}
#locked .big{font-size:min(6vw,40px)}#locked .sm{font-size:min(4.4vw,24px);font-weight:400;max-width:600px}
/* level */
.bar{width:100%;display:flex;align-items:center;gap:12px}
.bar .sp{flex:1}
#lvtitle{font-size:min(7vw,6vh,48px)}
#bubbles{flex:none;display:flex;flex-wrap:wrap;gap:min(2.2vw,18px);justify-content:center;max-width:1000px;padding:1.5vh 0}
.bub{width:min(17vw,15vh,128px);height:min(17vw,15vh,128px);border-radius:50%;background:#fff;box-shadow:0 7px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:min(6vw,5.2vh,44px);line-height:1.05}
.bub small{font-size:.4em;color:#8a7bb5;white-space:nowrap}
.bub.done{background:#fff3a6;box-shadow:0 7px 0 #e8c545}
.bub.now{background:var(--pink);color:#fff;box-shadow:0 7px 0 #d54a90;animation:pulse 1.1s infinite}
.bub.now small{color:#fff}
.bub.lock{opacity:.45}
#chips{flex:1;min-height:0;overflow:auto;touch-action:pan-y;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:flex-start;max-width:1000px;padding:8px}
.chip{min-width:52px;height:52px;padding:0 10px;border-radius:16px;background:#ffffffb0;font-size:28px;display:flex;align-items:center;justify-content:center;color:#a99cc9}
.chip.ok{background:var(--mint);color:#fff}
.chip.hard{background:#ffb347;color:#fff}
.chip .eng{height:.95em}
/* play */
#dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
#dots i{width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px var(--line)}
#dots i.d{background:var(--sun);box-shadow:none}#dots i.c{background:var(--pink);box-shadow:none;transform:scale(1.25)}
#pmali{height:min(11vh,90px);flex:none}
#stage{flex:1;width:100%;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5vh;position:relative}
.wrap{position:relative;height:min(100%,94vw);aspect-ratio:1;max-height:100%;background:#fff;border-radius:36px;box-shadow:0 8px 0 var(--line);flex:0 1 auto;min-height:0}
.wrap canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:36px}
.wrap .tag{position:absolute;left:14px;top:8px;font-size:min(7vw,6vh,52px);pointer-events:none}
.wrap .emo{position:absolute;right:14px;top:4px;font-size:min(10vw,8vh,76px);pointer-events:none}
.wrap .tools{position:absolute;left:12px;bottom:12px;display:flex;gap:10px}
.dotring{position:absolute;width:9%;height:9%;border-radius:50%;border:5px solid #29c36a;pointer-events:none;animation:ring 1.3s ease-out infinite}
.prompt{background:#fff;border-radius:34px;box-shadow:0 8px 0 var(--line);padding:1.5vh 4vw;min-width:min(70vw,420px);min-height:min(30vh,300px);display:flex;align-items:center;justify-content:center;gap:3vw;font-size:min(22vh,26vw,190px);line-height:1.15;text-align:center}
.prompt .eng{height:.9em}
.prompt .sm{font-size:.45em}
.choices{display:flex;gap:min(3vw,26px);justify-content:center;flex-wrap:wrap}
.ch{background:#fff;border-radius:30px;box-shadow:0 8px 0 var(--line);min-width:min(27vw,24vh,210px);height:min(27vw,24vh,210px);padding:0 14px;font-size:min(14vw,12vh,108px);display:flex;align-items:center;justify-content:center;border:6px solid #fff}
.ch .eng{height:.85em}
.ch.wide{font-size:min(10vw,9vh,84px)}
.ch.no{animation:shake .4s;opacity:.35;pointer-events:none}
.ch.yes{background:#d9ffe9;border-color:var(--mint);animation:pop .4s}
.ch.glow{border-color:var(--sun);animation:pulse .8s infinite}
.slots{display:flex;gap:12px}
.slot{width:min(16vw,14vh,120px);height:min(16vw,14vh,120px);border-radius:22px;border:5px dashed #c9b6ff;display:flex;align-items:center;justify-content:center;font-size:min(12vw,10vh,90px);color:var(--purple)}
.slot.f{border-style:solid;background:#f3ecff;animation:pop .3s}
.slot .eng{height:.9em}
.tile{background:var(--sun);box-shadow:0 7px 0 #d9a800;border-radius:22px;width:min(16vw,14vh,120px);height:min(16vw,14vh,120px);font-size:min(12vw,10vh,90px);display:flex;align-items:center;justify-content:center}
.tile .eng{height:.9em}
.tile.used{visibility:hidden}.tile.no{animation:shake .4s}.tile.glow{animation:pulse .8s infinite;background:#fff3a6}
.eng{height:1em;width:auto;display:inline-block;vertical-align:middle;overflow:visible}
.next{position:absolute;right:2vw;bottom:2vh;font-size:44px;width:110px;height:96px}
.wrap .toolic{position:absolute;left:12px;top:8px;font-size:min(7vw,6vh,50px);pointer-events:none}
.wrap .toolic.nudge{animation:pulse .5s 4}
.penbadge{width:min(26vw,22vh,190px);height:min(26vw,22vh,190px);border-radius:28%;background:linear-gradient(135deg,#fff3a6,#ffd447);box-shadow:0 0 0 6px #fff,0 10px 0 6px #e8c545;display:flex;align-items:center;justify-content:center;font-size:min(15vw,13vh,120px);animation:pop .6s,wobble 1.2s .6s infinite}
.bub.pen{background:#d9f3ff;box-shadow:0 7px 0 #7cc4ff}
input{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
#setup{justify-content:center;gap:2vh;overflow:auto;touch-action:pan-y}
#setup .box{background:#fff;border-radius:30px;box-shadow:0 8px 0 var(--line);padding:22px 26px;width:min(92vw,560px);display:grid;gap:14px}
#setup h1{margin:0;font-size:min(7vw,40px);text-align:center}
#setup label{display:grid;gap:4px;font-size:20px}
#setup label small{font-weight:400;color:#8a7bb5;font-size:15px}
#setup input{font-size:26px;padding:12px 16px;border-radius:16px;border:4px solid var(--line);background:#fbf8ff;width:100%}
#setup input:focus{outline:none;border-color:var(--pink)}
#setup .mm{height:min(20vh,150px)}
.wordstrip{position:absolute;top:4px;left:50%;transform:translateX(-50%);display:flex;gap:1px;font-size:min(6vh,6.5vw,46px);color:#cfc9ea;pointer-events:none;white-space:nowrap}
.wordstrip .eng{height:1em}.wordstrip .dn{color:var(--purple)}.wordstrip .cu{color:var(--pink)}
.board{max-width:min(96vw,760px)}
.board .ch{min-width:min(26vw,20vh,180px);height:min(26vw,20vh,180px);font-size:min(13vw,10vh,92px)}
.board .ch svg.shp{width:70%;height:70%}
.ch.hit{border-color:var(--mint);background:#e9fff3}
.ch.no2{animation:shake .4s}
.pip{display:inline-flex;align-items:center;justify-content:center;width:1.1em;height:1.1em;border-radius:50%;background:#efe9ff;color:#b9aee0;font-size:.55em;margin-left:.25em}
.pip.on{background:var(--mint);color:#fff}
.bubble{background:#fff;border-radius:30px;box-shadow:0 8px 0 var(--line);padding:1.2vh 3vw;display:flex;align-items:center;gap:2vw;font-size:min(10vh,12vw,90px);line-height:1.1}
.grade{width:min(24vw,20vh,170px);height:min(24vw,20vh,170px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:min(11vw,9vh,80px);color:#fff;background:#7cc4ff;box-shadow:0 0 0 6px #fff,0 10px 0 6px #5aa6e0;animation:pop .6s}
.grade.gAp{background:linear-gradient(135deg,#ffd447,#ff9e57);box-shadow:0 0 0 6px #fff,0 10px 0 6px #e8a800,0 0 40px #ffd447;animation:pop .6s,pulse 1s .6s infinite}
.grade.gA{background:#4fd3a8;box-shadow:0 0 0 6px #fff,0 10px 0 6px #2fae85}
.grade.gC{background:#c9b6ff;box-shadow:0 0 0 6px #fff,0 10px 0 6px #a48cf0}
#prow{display:flex;gap:3vw;align-items:center;justify-content:center;flex-wrap:wrap}
#pnew{font-size:min(4.2vw,4vh,30px);color:var(--purple)}
.bub.ap{background:linear-gradient(135deg,#fff3a6,#ffd447);box-shadow:0 7px 0 #e8a800}
.bub .g{font-size:.8em}
#closet .cl{flex:1;min-height:0;width:100%;max-width:1100px;display:flex;gap:2vw;align-items:center}
#clmali{height:min(56vh,44vw);flex:none}
#clrows{flex:1;min-width:0;max-height:100%;overflow:auto;touch-action:pan-y;display:grid;gap:1.2vh;align-content:center}
.clrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#ffffffa8;border-radius:22px;padding:8px 12px}
.clrow>b{font-size:30px;width:44px;text-align:center}
.opt{width:64px;height:64px;border-radius:18px;background:#fff;box-shadow:0 5px 0 var(--line);font-size:32px;display:flex;align-items:center;justify-content:center;border:5px solid #fff;position:relative}
.opt.on{border-color:var(--pink)}
.opt.lock{opacity:.45}
.opt .sw{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #d9cdf2}
.opt small{position:absolute;right:-6px;top:-8px;font-size:15px;background:var(--sun);border-radius:10px;padding:1px 5px}
@media (orientation:portrait){#closet .cl{flex-direction:column}#clmali{height:30vh}#clrows{width:100%}}
#pbody .qr{display:flex;gap:16px;align-items:center;flex-wrap:wrap}#pbody .qr img{width:220px;height:220px;image-rendering:pixelated;border-radius:12px;background:#fff}
/* party + book */
#party{justify-content:center;gap:2vh;text-align:center}
#party .big{font-size:min(9vw,8vh,70px)}
#pmali2{height:min(30vh,40vw)}
.stk{width:min(22vw,20vh,170px);height:min(22vw,20vh,170px);border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff,#ffe6f2 60%,#ffc2dd);border:6px dashed #fff;box-shadow:0 0 0 6px var(--pink),0 10px 0 6px #d54a90;display:flex;align-items:center;justify-content:center;font-size:min(12vw,11vh,96px);animation:pop .6s}
#bookgrid{flex:1;overflow:auto;touch-action:pan-y;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px;width:100%;max-width:900px;padding:14px;align-content:start}
#bookgrid .stk{width:92px;height:92px;font-size:50px;animation:none;box-shadow:0 0 0 4px var(--pink)}
#bookgrid .stk.no{filter:grayscale(1);opacity:.25;box-shadow:0 0 0 4px #ccc}
/* parent */
#parent{background:#fbf8ff;align-items:stretch;font-weight:400;font-family:system-ui,SkyThai,sans-serif;color:#222}
#pbody{flex:1;overflow:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;font-size:20px;line-height:1.45;max-width:900px;width:100%;margin:0 auto;padding:0 6px 40px}
#pbody h2{font-size:26px;margin:22px 0 8px;color:var(--ink)}
#pbody .box{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 2px 0 #e6def5;margin-bottom:10px}
#pbody .grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#pbody .it{min-width:40px;height:40px;border-radius:10px;background:#eee;color:#888;display:flex;align-items:center;justify-content:center;padding:0 8px;font-size:20px;font-weight:700}
#pbody .it.ok{background:#4fd3a8;color:#fff}#pbody .it.hard{background:#ffb347;color:#fff}
#pbody .meter{height:14px;background:#eee;border-radius:7px;overflow:hidden;margin:6px 0}
#pbody .meter i{display:block;height:100%;background:var(--mint)}
#pbody button.p{font-size:20px;background:#efe6ff;border-radius:14px;padding:12px 16px;margin:4px 6px 4px 0;font-weight:700;color:var(--ink)}
#pbody button.p.on{background:var(--mint);color:#fff}
#pbody button.p.danger{background:#ffe1e1;color:#b00020}
#pbody .key{font-size:16px;color:#666}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}

<script>
'use strict';
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const h=(tag,a={},...kids)=>{const e=document.createElement(tag);for(const k in a){if(k==='class')e.className=a[k];else if(k==='html')e.innerHTML=a[k];else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k])}kids.flat().forEach(c=>c!=null&&e.append(c));return e};
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[rnd(a.length)];
const coal=e=>{let a=[];try{a=e.getCoalescedEvents?e.getCoalescedEvents():[]}catch(_){}return a.length?a:[e]};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

/* ================= saved progress (on this device only) ================= */
const KEY='sky-letters-v2';
function fresh(){let stars=0;try{stars=+localStorage.getItem('skystars')||0}catch(_){}
  return {v:2,stars,stickers:[],rounds:{},items:{},days:{},bday:0,pen:0,penRounds:{},grades:{},wear:[],look:{wings:'',head:'',neck:'',body:'white',mane:'rainbow',horn:'gold',extra:''},sec:'en',set:{unlock:false,talk:'en',sounds:true,tool:'auto',ven:'',vth:'',pack:''}}}
let S=fresh();
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===2)S=Object.assign(fresh(),s,{set:Object.assign(fresh().set,s.set),look:Object.assign(fresh().look,s.look)})}catch(_){}
/* the child: nickname (spoken), first and last name (for writing practice). Kept apart so "erase progress" does not forget who she is. */
const NKEY='sky-letters-kid';let KID=null;
try{const k=JSON.parse(localStorage.getItem(NKEY));if(k&&k.nick)KID=k}catch(_){}
const nick=()=>KID?KID.nick:'Sky',isSky=()=>nick().toLowerCase()==='sky';
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* which writing tool right now: finger first, the magic pencil after she earns it (parent page can force one) */
const PEN_AFTER=2;   // finished writing games (with a finger) before the pencil is earned
const tool=()=>S.set.tool==='finger'?'finger':S.set.tool==='pen'?'pen':(S.pen?'pen':'finger');
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}}

/* ================= sound: beeps + the iPad's own voice ================= */
let ac=null;
function beep(notes,type='triangle',vol=.22,step=.13){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
  let t=ac.currentTime+.01;notes.forEach(n=>{const f=Array.isArray(n)?n[0]:n,d=Array.isArray(n)?n[1]:step;if(f){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d*.95);o.start(t);o.stop(t+d)}t+=d})}catch(_){}}
const ding=()=>beep([659,880,1175]),boop=()=>beep([220,196],'sine',.18,.12),tick=()=>beep([880],'sine',.12,.06),fanfare=()=>beep([523,659,784,1047,784,1047],'triangle',.22,.14);
/* ---- music and tap sounds (our own tune, made here; parent page can turn them off) ---- */
const sfxOn=()=>!(S&&S.set&&S.set.music===false);
const MUSIC_SCR=['setup','welcome','home','level'];   // opening and game-choosing pages only, never inside a learning game
const NOTE=n=>440*Math.pow(2,(n-69)/12);
// a happy 8-bar tune in C (melody, bass), one entry per eighth note; 0 = rest
const MEL=[72,76,79,76,77,76,74,0, 72,76,79,84,81,79,0,0, 77,81,79,76,77,76,74,72, 74,76,74,71,72,0,0,0, 72,76,79,76,77,76,74,0, 81,79,77,76,74,76,77,79, 81,84,81,79,77,76,74,76, 72,79,76,74,72,0,0,0];
const BASS=[48,0,55,0,53,0,55,0, 48,0,55,0,57,0,55,0, 53,0,57,0,48,0,55,0, 50,0,55,0,48,0,43,0, 48,0,55,0,53,0,55,0, 57,0,53,0,50,0,55,0, 53,0,57,0,48,0,55,0, 48,0,43,0,48,0,0,0];
let mus=null;
function musicStart(){if(mus||!sfxOn()||!ac)return;if(ac.state!=='running'){ac.resume().then(()=>{if(ac.state==='running'&&MUSIC_SCR.includes(scr))musicStart()}).catch(()=>{});return}const g=ac.createGain();g.gain.value=.05;g.connect(ac.destination);
  const step=60/112/2;let i=0,t=ac.currentTime+.1;
  const tone=(f,at,d,type,v)=>{const o=ac.createOscillator(),e=ac.createGain();o.type=type;o.frequency.value=f;o.connect(e);e.connect(g);e.gain.setValueAtTime(.0001,at);e.gain.exponentialRampToValueAtTime(v,at+.02);e.gain.exponentialRampToValueAtTime(.0001,at+d);o.start(at);o.stop(at+d+.02)};
  const timer=setInterval(()=>{while(t<ac.currentTime+.4){const k=i%MEL.length;if(MEL[k])tone(NOTE(MEL[k]),t,step*.9,'triangle',.9);if(BASS[k])tone(NOTE(BASS[k]),t,step*1.8,'sine',.7);t+=step;i++}
    const talking=clipSrc||('speechSynthesis' in window&&speechSynthesis.speaking);g.gain.setTargetAtTime(talking?.012:.05,ac.currentTime,.15)},120);   // quieter while Twinkle talks
  mus={g,timer}}
function musicStop(){if(!mus)return;const m=mus;mus=null;clearInterval(m.timer);try{m.g.gain.setTargetAtTime(.0001,ac.currentTime,.2);setTimeout(()=>m.g.disconnect(),900)}catch(_){}}
const musicFor=id=>MUSIC_SCR.includes(id)&&sfxOn()?musicStart():musicStop();
const twinkle=()=>beep([[1568,.07],[2093,.07],[2637,.07],[3136,.09],[2637,.07],[3136,.18]],'sine',.12);
const SFX={pop:()=>beep([[660,.05],[990,.07]],'sine',.2),boing:()=>{beep([[440,.06],[330,.06],[262,.1]],'square',.06)},squeak:()=>beep([[1400,.04],[1900,.05],[2400,.05]],'sine',.1),sparkle:()=>beep([[1047,.05],[1319,.05],[1568,.05],[2093,.08]],'triangle',.14)};
const sfxFor=b=>/back$|^quit$|^phome$/.test(b.id)?'boing':b.closest('#closet')?'squeak':b.classList.contains('pink')?'sparkle':'pop';
let twinkled=false;
document.addEventListener('pointerdown',e=>{const b=e.target.closest('button,[onclick],.it,.lv,.star');
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(_){}
  if(!sfxOn()||scr==='parent'||scr==='play')return;   // the games make their own right/wrong sounds
  if(!twinkled){twinkled=true;twinkle()}else if(b)SFX[sfxFor(b)]();
  setTimeout(()=>musicFor(scr),60)},true);
const Voice={en:null,th:null,n:0};
function pickVoices(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices();Voice.n=vs.length;if(!vs.length)return;
  const L=v=>v.lang.replace('_','-').toLowerCase();
  const best=(pre,exact,names)=>{let c=vs.filter(v=>L(v)===exact);if(!c.length)c=vs.filter(v=>L(v).startsWith(pre));if(!c.length)return null;
    for(const n of names){const v=c.find(v=>v.name.includes(n));if(v)return v}return c[0]};
  Voice.en=vs.find(v=>v.name===S.set.ven)||best('en','en-us',['Samantha','Ava','Allison','Zoe','Nicky','Susan','Google US']);
  Voice.th=vs.find(v=>v.name===S.set.vth)||best('th','th-th',['Kanya','Narisa']);
  Voice.all=vs}
if('speechSynthesis' in window){pickVoices();speechSynthesis.onvoiceschanged=pickVoices}
let sayTok=0;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function mkU([t,lang,rate]){const u=new SpeechSynthesisUtterance(isSky()?t:lang==='th'?t.replace(/ ?สกาย/g,''):t.replace(/\bSky\b/g,nick()));u.lang=lang==='th'?'th-TH':'en-US';const v=lang==='th'?Voice.th:Voice.en;if(v)u.voice=v;
  u.rate=rate||(lang==='th'?.8:.9);u.pitch=1.55;return u}// higher pitch = cute cartoon unicorn
/* say(['Hello',['สวัสดี','th'],['cat','en',.5],['b','clip']])  each part: text, or [text, lang, speed], or a recorded letter sound */
function say(parts){if(!('speechSynthesis' in window))return;if(!Voice.n)pickVoices();
  parts=[].concat(parts).filter(Boolean).map(p=>typeof p==='string'?[p,'en']:p).map(p=>p[1]==='en'&&un()!=='Mali'?[p[0].replace(/\bMali\b/g,un()),...p.slice(1)]:p).map(p=>p[1]==='th'&&hasClip(tid(p[0]))&&(isSky()||!/สกาย/.test(p[0]))?[tid(p[0]),'clip']:p[1]==='en'&&hasClip(eid(p[0]))&&(isSky()||!/\bSky\b/.test(p[0]))?[eid(p[0]),'clip']:p).filter(p=>p[1]!=='clip'||hasClip(p[0]));const tok=++sayTok;stopClip();
  if(parts.some(p=>p[1]==='clip'))return saySeq(parts,tok);
  const go=()=>{if(tok!==sayTok)return;for(const p of parts){if(p[1]==='th'&&Voice.n&&!Voice.th)continue;try{speechSynthesis.speak(mkU(p))}catch(_){}}};
  try{if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(go,90)}else go()}catch(_){}}
async function saySeq(parts,tok){try{speechSynthesis.cancel()}catch(_){}await wait(70);
  for(const p of parts){if(tok!==sayTok)return;
    if(p[1]==='clip'){await playClip(p[0]);await wait(140)}
    else if(!(p[1]==='th'&&Voice.n&&!Voice.th))await new Promise(res=>{const u=mkU(p);let fin=false;const end=()=>{if(!fin){fin=true;res()}};u.onend=u.onerror=end;try{speechSynthesis.speak(u)}catch(_){end()}setTimeout(end,1500+p[0].length*120)})}}
const tid=t=>'w-'+t.trim().replace(/\s+/g,'-');
const eid=t=>'e-'+t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');  // Dad's English line clips: e-hi-sky-what-do-you-want-to-play
const un=()=>'Twinkle';
const hush=()=>{sayTok++;stopClip();try{speechSynthesis.cancel()}catch(_){}};
/* ---- letter sounds recorded in a real voice (phonics). Kept on this device. ---- */
const CLIPS={},CLIPBUF={},PACK={};let clipSrc=null,PACKS=[];
const clipUrl=k=>CLIPS[k]||PACK[k],hasClip=k=>!!(CLIPS[k]||PACK[k]);
/* ready-made voice packs live in the voices folder next to the app (see voices/packs.json). Family clips never go there. */
async function packsLoad(){try{const r=await fetch('voices/packs.json',{cache:'no-cache'});if(!r.ok)return;PACKS=(await r.json()).packs||[];packUse(S.set.pack,false)}catch(_){}}
function packUse(id,warm){for(const k in PACK){delete PACK[k];delete CLIPBUF[k]}const p=PACKS.find(x=>x.id===id);if(!p)return;
  (p.clips||[]).forEach(k=>{PACK[k]='voices/'+p.id+'/'+k+'.'+(p.ext||'mp3');delete CLIPBUF[k]});
  if(warm)(p.clips||[]).forEach((k,i)=>setTimeout(()=>fetch(PACK[k]).catch(()=>{}),i*60))}   // fetch once so it also works with no internet
function stopClip(){try{clipSrc&&clipSrc.stop()}catch(_){}clipSrc=null}
function adb(){return new Promise((res,rej)=>{const r=indexedDB.open('sky-letters-audio',1);r.onupgradeneeded=()=>r.result.createObjectStore('clips');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function clipsLoad(){try{const db=await adb();await new Promise(res=>{const q=db.transaction('clips').objectStore('clips').openCursor();q.onsuccess=e=>{const c=e.target.result;if(c){CLIPS[c.key]=c.value;c.continue()}else res()};q.onerror=()=>res()})}catch(_){}}
async function clipSave(k,url){CLIPS[k]=url;delete CLIPBUF[k];const db=await adb();await new Promise((res,rej)=>{const t=db.transaction('clips','readwrite');t.objectStore('clips').put(url,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function clipDel(k){delete CLIPS[k];delete CLIPBUF[k];try{const db=await adb();await new Promise(res=>{const t=db.transaction('clips','readwrite');t.objectStore('clips').delete(k);t.oncomplete=res;t.onerror=res})}catch(_){}}
async function playClip(k){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')await ac.resume();
    if(!CLIPBUF[k]){const bin=await (await fetch(clipUrl(k))).arrayBuffer();const buf=await new Promise((res,rej)=>ac.decodeAudioData(bin,res,rej));
      const d=buf.getChannelData(0);let a=0,b=d.length-1;while(a<d.length&&Math.abs(d[a])<.03)a++;while(b>a&&Math.abs(d[b])<.03)b--;   // skip the quiet start and end
      const off=Math.max(0,a/buf.sampleRate-.06),dur=Math.min(buf.duration-off,(b-a)/buf.sampleRate+.2);CLIPBUF[k]={buf,off,dur:dur>0.05?dur:buf.duration}}
    const c=CLIPBUF[k];await new Promise(res=>{const src=ac.createBufferSource(),g=ac.createGain();g.gain.value=k.length===1?1.8:1.25;src.buffer=c.buf;src.connect(g);g.connect(ac.destination);clipSrc=src;src.onended=res;src.start(0,c.off,c.dur);setTimeout(res,(c.dur+.5)*1000)})}catch(_){}}
async function recordClip(k,ms){const stream=await navigator.mediaDevices.getUserMedia({audio:true});const mr=new MediaRecorder(stream),chunks=[];mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  const stopped=new Promise(res=>mr.onstop=res);mr.start();await wait(ms);mr.stop();await stopped;stream.getTracks().forEach(t=>t.stop());
  const blob=new Blob(chunks,{type:mr.mimeType||(chunks[0]&&chunks[0].type)||'audio/mp4'});
  const url=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(blob)});await clipSave(k,url)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)hush()});

/* ================= what she has learned ================= */
function rec(key,miss,ms,pen){if(!key)return;const it=S.items[key]||(S.items[key]={n:0,miss:0,ms:0});it.n++;it.miss+=miss;it.ms+=ms;it.lm=miss;it.lt=ms;it.last=Date.now();if(pen)it.pen=(it.pen||0)+1}
const hardScore=k=>{const it=S.items[k];if(!it||!it.n)return 0;return (it.lm||0)*1.5+it.miss/it.n+(it.lt>45000?1:0)};
const isHard=k=>hardScore(k)>=3;
function weakest(keys,n){return keys.filter(k=>S.items[k]).sort((a,b)=>hardScore(b)-hardScore(a)||S.items[a].last-S.items[b].last).slice(0,n)}

/* ================= friend codes =================
   On the web address, a new iPad needs a scan code. Each code is made on the owner's device, is different every time,
   and stops opening the app on new iPads after its last day. Codes are signed, so nobody else can make them. */
const PUB={x:'TtA4i26B_TlvpkpTsUz2dSKE2ypPPFOO22pEwD2yGe0',y:'VO5cWUwFnxBcGnOMR-08dCSBhsdhJ08_e2WrnQzr5Dw'},PASSKEY='sky-letters-pass',OWNKEY='sky-letters-owner',CODEKEY='sky-letters-codes';
const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=t=>Uint8Array.from(atob(t.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const EC={name:'ECDSA',namedCurve:'P-256'},SG={name:'ECDSA',hash:'SHA-256'},enc=t=>new TextEncoder().encode(t),today0=()=>Math.floor(Date.now()/864e5);
const gateOn=()=>location.protocol==='https:'||/[?&]gate=1/.test(location.search);
const pubKey=()=>crypto.subtle.importKey('jwk',{kty:'EC',crv:'P-256',x:PUB.x,y:PUB.y,ext:true},EC,false,['verify']);
const privKey=d=>crypto.subtle.importKey('jwk',{kty:'EC',crv:'P-256',x:PUB.x,y:PUB.y,d,ext:true},EC,false,['sign']);
async function isOwnerKey(d){try{const sig=await crypto.subtle.sign(SG,await privKey(d),enc('owner'));return await crypto.subtle.verify(SG,await pubKey(),sig,enc('owner'))}catch(_){return false}}
async function checkCode(code){const m=/^(\d+)\.([a-z0-9]+)\.([A-Za-z0-9_-]+)$/.exec(code||'');if(!m)return 'bad';
  try{if(!await crypto.subtle.verify(SG,await pubKey(),unb64u(m[3]),enc(m[1]+'.'+m[2])))return 'bad'}catch(_){return 'bad'}
  return +m[1]>=today0()?'ok':'old'}
async function makeCode(days){const msg=(today0()+days)+'.'+Math.random().toString(36).slice(2,8);
  return msg+'.'+b64u(await crypto.subtle.sign(SG,await privKey(localStorage.getItem(OWNKEY)),enc(msg)))}
const isOwner=()=>{try{return !!localStorage.getItem(OWNKEY)}catch(_){return false}};
async function gate(){if(!gateOn())return 'ok';const q=new URLSearchParams(location.search);
  try{const own=q.get('owner');if(own&&await isOwnerKey(own)){localStorage.setItem(OWNKEY,own);localStorage.setItem(PASSKEY,'owner');history.replaceState(null,'',location.pathname+(q.get('gate')?'?gate=1':''))}
    if(localStorage.getItem(PASSKEY))return 'ok';
    const k=q.get('k');if(k){const r=await checkCode(k);if(r==='ok')localStorage.setItem(PASSKEY,'friend');return r}}catch(_){return 'bad'}
  return 'none'}
